# Test-outcome nodes — hand-authored. The identity is {runId}/{specId}; the
# stored content is the result record for that specification in that run.
#
# One run, eight results, nine specifications: SEG-TS-003 has no outcome on
# purpose, so the fixture carries a coverage gap for the gate to find.
#
# The result record holds only fields that repeat: no duration, no timestamp,
# no environment. A form carrying either would make the content hash a function
# of when the run happened rather than of what it observed.
#
# `result` and `revision` are the entry's non-content keys: the recorded
# result of the execution and the revision it ran against, stated beside the
# content whose hash covers the record of it. A test asserts result and
# content agree, because nothing else makes them; the revision is the same
# single, made-up value throughout, since this fixture stands for one run.

kind = "TestOutcome"

[nodes]
"run-0001/SEG-TS-001" = { contentHash = "test-outcome/run-0001.SEG-TS-001.txt", result = "passed", revision = "r1" }
"run-0001/SEG-TS-002" = { contentHash = "test-outcome/run-0001.SEG-TS-002.txt", result = "passed", revision = "r1" }
"run-0001/SEG-TS-004" = { contentHash = "test-outcome/run-0001.SEG-TS-004.txt", result = "passed", revision = "r1" }
