# Test-outcome nodes — one per specification, from the verification
# suite's run against the tree at 678f72f. The identity is
# {runId}/{specId}; the stored content is the result record for that
# specification in that run.
#
# The result record holds only fields that repeat: no duration, no
# timestamp, no environment. A form carrying either would make the
# content hash a function of when the run happened rather than of what
# it observed.
#
# `result` and `revision` are the entry's non-content keys: the recorded
# result of the execution and the revision it ran against, stated beside
# the content whose hash covers the record of it. A test asserts result
# and content agree, because nothing else makes them.

kind = "TestOutcome"

